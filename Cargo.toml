[package]
name = "kannaka-attention"
version = "0.2.0"
edition = "2021"
description = "Attention-as-gravity: a sparse-attention beam over kannaka-memory's holographic resonance medium. Recency ring + log-stride snapshots + landmark exemplars + optional salience gate, producing a K-sized candidate set for Medium::recall_against_ids. Pure Rust, no GPU/BLAS/vector-DB. Target: ARM/edge."
license-file = "LICENSE"
repository = "https://github.com/kannaka-labs/kannaka-attention"
readme = "README.md"
documentation = "https://docs.rs/kannaka-attention"
keywords = ["attention", "sparse", "memory", "retrieval", "edge"]
categories = ["algorithms", "data-structures"]

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
rand = "0.8"
serde_json = "1"
